name: Code quality and regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      STUDIO_JUDGE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binDirectory = if ($IsWindows) { "Scripts" } else { "bin" }
          $venvBin = Join-Path (Join-Path $PWD ".venv") $binDirectory
          $venvBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify isolated Python environment
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'CI must use its isolated virtual environment'; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check app tests scripts sample_project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check app tests scripts sample_project
      - name: Check frontend and documentation formatting
        run: npm run format:check
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Check unified Studio navigation
        run: npm run test:ui
      - name: Run regression tests with local fixtures
        run: python -m pytest -q
      - name: Check comparison UI in an isolated workspace
        run: python scripts/check-exact-compare.py
